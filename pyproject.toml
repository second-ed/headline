[project]
name = "headline"
authors = [
    {name="ed cuss"},
]
description = "dynamically reorder functions"
readme = "docs/README.md"
requires-python = ">=3.8"
version = "0.1.0"
dependencies = [
    "attrs",
    "black>=24",
    "isort",
    "libcst",
    "python-dotenv >= 0.20.0",
]

[tool.black]
line-length = 88
force-exclude = "mock_data"

[tool.ruff]
force-exclude = true
exclude = ["mock_data"]
lint.extend-select = ["I", "W"]
lint.ignore = ["E741"]
line-length = 88


[tool.pytest.ini_options]
testpaths = [
    "tests",
]


[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*__init__.py",
    "*config.py",
    "*_logger.py",
    "*main.py", 
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "matplotlib>=3.7.5",
    "networkx>=3.1",
    "pre-commit>=3.5.0",
    "pydot>=3.0.4",
    "pytest>=8.3.4",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.4",
]
