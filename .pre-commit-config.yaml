repos:
- repo: local
  hooks:
    - id: ruff format
      name: ruff format
      entry: ruff format
      language: system
      args: [--exclude=mock_data]
      types_or: [python, jupyter]
    - id: ruff lint
      name: ruff lint
      entry: ruff check
      language: system
      types_or: [ python, pyi, jupyter ]
      args: [ --fix, --exclude=mock_data]
    - id: pytest-check
      name: pytest-check
      entry: pytest 
      language: system
      pass_filenames: false
      always_run: true
